set -g mouse on
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -g set-clipboard on
set -as terminal-features ',alacritty*:clipboard'
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g detach-on-destroy off

# Simple quality-of-life bindings.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Blackout Moss: readable graphite surfaces, moss-phosphor instrumentation, amber caution.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g status-style 'bg=#000000,fg=#A8B995'
set -g message-style 'bg=#D0A65A,fg=#0D1110'
set -g message-command-style 'bg=#5B6A5C,fg=#E1E8DE'
set -g mode-style 'bg=#5B6A5C,fg=#E1E8DE'
set -g pane-border-style 'fg=#465347'
set -g pane-active-border-style 'fg=#6F7F70'

set -g status-left '#[fg=#B8C8AE,bold]#S#[default] #[fg=#5B6A5C]|#[default] #[fg=#D0A65A,bold]#{?client_prefix,prefix ,}#[default]'
set -g status-right '#[fg=#B8C8AE]#H #[fg=#5B6A5C]| #[fg=#A8B995]%Y-%m-%d %H:%M '
set -g window-status-separator ' '

set -g window-status-style 'fg=#B8C8AE,bg=#000000'
setw -g window-status-format '#[fg=#8A998B,bg=#000000]#I#[fg=#5B6A5C,bg=#000000]:#[fg=#B8C8AE,bg=#000000]#W#{?window_flags,#{window_flags},}'
setw -g window-status-current-style 'fg=#000000,bg=#B8C8AE,bold'
setw -g window-status-current-format '#[fg=#000000,bg=#B8C8AE,bold] #I#[fg=#223026,bg=#B8C8AE]:#[fg=#000000,bg=#B8C8AE,bold]#W#{?window_flags,#{window_flags},} '
