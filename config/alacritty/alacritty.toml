[colors]
# Blackout Moss: graphite cockpit surfaces, moss-phosphor instrumentation, amber caution.
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#050706"
foreground = "#B7C2B3"

[colors.normal]
black   = "#050706"
red     = "#B45A4F"
green   = "#6F7F69"
yellow  = "#C79545"
blue    = "#6F9A9A"
magenta = "#8A728C"
cyan    = "#7FA7A0"
white   = "#B7C2B3"

[colors.bright]
black   = "#3E473F"
red     = "#D07165"
green   = "#A8B995"
yellow  = "#D6A24A"
blue    = "#8DB6B6"
magenta = "#A88FAA"
cyan    = "#A7C9C1"
white   = "#D5DED2"

[colors.cursor]
cursor = "#A8B995"
text   = "#050706"

[colors.vi_mode_cursor]
cursor = "#C79545"
text   = "#050706"

[colors.selection]
text = "#D5DED2"
background = "#263026"

[cursor]
unfocused_hollow = true
blink_interval = 750
blink_timeout = 0
[cursor.style]
shape = "Block"
blinking = "On"
[env]
TERM = "xterm-256color"
[font]
size = 11.0
[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style  = "Regular"
[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold"
[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style  = "Italic"
[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold Italic"
[font.offset]
x = 0
y = 0
# Add glyph offset for better rendering
[font.glyph_offset]
x = 0
y = 0
[mouse]
hide_when_typing = true
[scrolling]
history    = 5000
multiplier = 3
[terminal]
shell = "/bin/zsh"
[window]
decorations     = "none"
dynamic_title   = true
opacity         = 1.0
title           = "Alacritty"
# Add appropriate padding
[window.padding]
x = 4
y = 4
[window.class]
general  = "Alacritty"
instance = "Alacritty"
# Disable visual bell to save CPU cycles
[bell]
duration = 0

# General settings
[general]
live_config_reload = true

# Key bindings for better workflow
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
